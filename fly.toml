# Fly.io deployment config — Lumira Atelier Backend.
#
# Deploy runbook for the owner — see lumira-backend/DEPLOY.md for details.
# Short version:
#   $ cd lumira-backend
#   $ flyctl auth login                                # one-time, opens browser
#   $ flyctl launch --copy-config --no-deploy          # first time only
#   $ flyctl secrets set OPENAI_API_KEY=sk-nex-...      \
#                        OPENAI_BASE_URL=https://api.openbili.com/v1
#   $ flyctl deploy
#
# After deploy you get a URL like https://lumira-atelier-backend.fly.dev.
# Paste that URL into Cloudflare Worker's LUMIRA_BACKEND_URL secret.

app = "lumira-atelier-backend"

# Singapore region. Fly deprecated hkg in 2026 ("Region hkg is deprecated
# and cannot have new resources provisioned"); sin is the recommended
# replacement for Asia-Pacific. CF Worker → Fly SIN ≈ 40-70ms which is
# still fine because the latency floor is the LLM relay round-trip
# (api.openbili.com, ~200-400ms), not the Fly hop.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

# ──────────────────────────────────────────────────────────────────────
# Environment variables baked into the image.
# Secrets (API keys, DB passwords) go through `flyctl secrets set` — they
# live in Fly's encrypted vault, not in this file.
# ──────────────────────────────────────────────────────────────────────
[env]
  ENV = "production"
  LOG_LEVEL = "INFO"
  # Frontend lives on lumirahq.com (Cloudflare Worker). Add prod domains
  # here so the FastAPI CORSMiddleware accepts the browser's Origin header.
  CORS_ALLOWED_ORIGINS = "https://lumirahq.com,https://www.lumirahq.com,https://agent.lumirahq.com"

# ──────────────────────────────────────────────────────────────────────
# HTTP service — exposes :8000 from the container to the public internet
# at https://<app>.fly.dev. force_https redirects http → https.
#
# Lessons learned in production e2e (2026-05-21):
#
#   - cold start measured: ~100 s for fully idle VM
#     (12 s uv bytecode compile + 8 s uvicorn boot + Optiland/scipy/numpy
#     module imports). Fly's proxy gave up after 8 s (PM05) and returned
#     503 to clients. With auto_stop_machines = "stop" + min_machines_running
#     = 0 the first user after an idle period got a hard error rather than
#     a slow response.
#
#   - Fix: keep ONE machine always running. Idle cost ≈ $5-8/month for the
#     shared-cpu-2x size (Fly bills shared-cpu by RAM × time when machine
#     is in started state). The second machine in the pool still auto-stops
#     when idle so we still get most of the cost saving.
#
# If traffic stays so low even one machine is overkill, dial
# `min_machines_running` back to 0 — but only after replacing the cold-
# start hot path (e.g. pre-warming Optiland imports in a startup task).
# ──────────────────────────────────────────────────────────────────────
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

# ──────────────────────────────────────────────────────────────────────
# VM size — shared-cpu-2x, 2 GB RAM.
# Optiland + numpy + scipy + rayoptics peak at ~1.2 GB during raytrace;
# 2 GB gives headroom for concurrent requests. CPU intensive but the
# bottleneck is the LLM relay round-trip, not the math.
# ──────────────────────────────────────────────────────────────────────
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
