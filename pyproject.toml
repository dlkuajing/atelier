[project]
name = "lumira-backend"
version = "0.1.0"
description = "Lumira Atelier · Optical Co-Pilot Backend (FastAPI + Optiland + prysm + rayoptics + pgvector RAG)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.10",
    "structlog>=24.4.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

# Heavy optical libs live in optional groups so the Docker base image can
# install them in a separate layer (BLAS / LAPACK / system deps).
optical = [
    "optiland>=0.5.9",
    "prysm>=0.21",
    "rayoptics>=0.9.5",
    "opticalglass>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
