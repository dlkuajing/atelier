# LiteLLM stack — run on HK VPS.
# See OWNER-CHECKLIST.md for VPS setup steps.

services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumira-litellm
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
