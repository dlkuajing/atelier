name: CI

# paths-ignore：纯文档/规划变更不跑全量 pytest（2026-07-27）。
# GitHub 语义 = 变更文件「全部」命中 ignore 才跳过；只要有一个源码文件被改就照跑，
# 因此混合 PR 不会漏测。.github/ 自身不在 ignore 列表，改 CI 必定触发自验。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全仓库 ruff 在本机实测 All checks passed，所以这道闸是「守住现状」而非
  # 「先清债」——它现在就该绿，任何一次变红都是本次改动引入的。
  # 单独一个 job：约 20 秒出结果，不必等 20 分钟的 pytest 分片才知道格式坏了。
  # mypy 不进闸：同一时刻实测 `uv run mypy app` 报 698 errors / 38 files，
  # 挂上去只会是一道永远红的闸。清它是另一铲。
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (dev only)
        run: uv sync --frozen --group dev

      - name: ruff check
        run: uv run ruff check .

  backend:
    name: Backend fast (pytest ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # 分片，不是 -n 并行：-n 在 nproc=2 的 runner 上三次实测均为负优化
      # （争用 + 每 worker 重复导入 Optiland/scipy/numpy）；分片是独立 VM。
      fail-fast: false
      matrix:
        shard: [1, 2]
    # 车道化（2026-08-01）终结了「分片轮盘」时代：40->60->120->180->240 的帽
    # 竞赛五轮五败，根因是四个全语料扫描重文件（实测 optical_match 176 分钟 /
    # seed_intake 97 / acceptance 59 / patent_to_zmx 48，合计占已称重总量 96%）
    # 在 LPT 分片里随机聚落，叠加 acceptance 的 _report() memo 被拆散后 4x
    # 冷启动与 runner 机速方差——耗时表永远追不上。四文件现走下面的
    # backend-heavy 固定车道；本 job 只跑其余 ~4400 条轻测试（实测合计
    # ~16 分钟），90 分钟帽 = 轻池实测的 5 倍余量。帽竞赛的完整实测脉络
    # 见 git log 本文件。
    #
    # ⚠️ 真正的根治仍是查清「重锚后路由为何慢 3.5 倍」——`match_case` 在请求
    # 路径上，这同时是生产问题。已单独立项。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Git LFS evidence cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.planning/quick/260727-patent-saturation-repository-slimming/lfs-evidence-manifest.json') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Hydrate and verify patent evidence
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (core + dev + optical)
        run: uv sync --frozen --group dev --group optical

      # runner 规格是本仓库 CI 时长的第一约束，先把它变成 CI 日志里的事实。
      # 历史教训：曾凭印象在注释里断言「ubuntu-latest 是 4 核 16GB」并据此设 -n 4，
      # 从未核实。本仓库是 PRIVATE，标准 runner 规格与公开仓库不同——实测为准。
      - name: Report runner spec
        run: |
          echo "nproc=$(nproc)"
          echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          free -g
          df -h / | tail -1

      # 覆盖面守卫：分片漏掉的测试表现为「更快的绿」，与真绿无法区分——
      # 正是本仓库反复中招的那类陷阱在 CI 层的变体。所以在**跑任何测试之前**
      # 断言各分片 node-id 并集 == 当前实际收集到的全量、且两两不相交。
      # 全量列表来自 --collect-only（运行时事实），不是 durations 文件（可能过期），
      # 所以新增的测试会被分配而不是被跳过。
      # --exclude-file 四项必须与下面 backend-heavy 三条车道的 paths 并集逐字一致
      # ——这是「每条测试恰好跑一次」的车道层契约。ci_shards 对收集不到测试的
      # 排除名单会报错退出（防拼写错静默缩水覆盖面）。
      - name: Build and verify shard partition
        run: |
          uv run python scripts/ci_shards.py             --shards 2 --index ${{ matrix.shard }} --out /tmp/shard.txt \
            --exclude-file tests/test_optical_match.py \
            --exclude-file tests/test_seed_intake_audit.py \
            --exclude-file tests/test_acceptance_task_export.py \
            --exclude-file tests/test_patent_to_zmx.py
          echo "shard test count: $(wc -l < /tmp/shard.txt)"

      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        # 串行。并行化在这台 runner 上是负优化，三次实测（同一套测试）：
        #   串行基线   ~35 分钟   (install 仅占 13 秒)
        #   -n 4       37 分 38 秒  run 30242379840
        #   -n 2       40 分 30 秒  run 30245575480
        # worker 越多越慢。上面 Report runner spec 实测出根因：nproc=2 / 7GB
        # （不是本注释原先断言的 4 核 16GB——本仓库是 PRIVATE），且关键路径
        # 被单个 1027 秒的测试锁死，天然不可并行。每个 worker 还要各自重新
        # 导入 Optiland/scipy/numpy，2 核上纯属自相争用。
        #
        # 真正的瓶颈是重复计算而非并行度：--durations=25 显示前 25 个测试吃掉
        # 约 85% CPU 时间，其中三个 acceptance 测试参数完全相同、各跑约 260 秒。
        # 见 tests/test_acceptance_task_export.py 的 _report() memo。
        # --durations=25 保留：慢测试分布是后续分档决策的依据。
        # 不用 -v：逐条输出对 CI 日志无价值，只增加 IO。
        # --durations=25 保留：慢测试分布是刷新 tests/ci-shard-durations.json 的依据。
        run: |
          # -d 参数用换行符：每行逐字当一个参数。xargs 默认会解释引号和反斜杠
          # 并按空白拆分，而参数化 node-id 里这些字符很常见（单是分片 1 就有 25 条）。
          # 首次分片自测正是死在这里：unrecognized arguments: -55.65n4。
          # 实测 1083 行 -> 默认 xargs 产出 1358 个参数，-d 换行 产出 1083 个。
          # -x: 参数超长时宁可报错也不静默分批（分批会把一片拆成多次 pytest 调用、
          # 各出一份 summary）。单片实测 112KB，远低于 2MB ARG_MAX。
          #
          # --timeout: 单条测试上限，把"某片挂满一小时、日志里什么都没有"变成
          # "某条测试超时 + 一份栈"。轻池已无已知慢测试（重文件全在 backend-heavy
          # 车道），7200s 在这里纯是围堵帽；标定脉络（1800->3600->7200，均实测
          # 依据）见 git log 本文件。--timeout-method=thread 跨平台可用。
          xargs -x -d '\n' -a /tmp/shard.txt uv run pytest -q --durations=25 \
            --timeout=7200 --timeout-method=thread -m "not real_machine"

  # 重车道（2026-08-01）：四个全语料扫描重文件按文件固定分道，不进分片轮盘。
  # 确定性（每道内容固定）、memo 友好（acceptance 的 _report() memo 同道共享，
  # 实测拆散要付 4x 冷启动）、可预算（各道实测 176/97/107 分钟）。
  # ⚠️ 契约：三道 paths 的并集必须与上面 backend-fast 的 --exclude-file 名单
  # 逐字一致——fast 侧对收集不到测试的排除项会报错，heavy 侧路径拼错则
  # pytest 因找不到文件而红，两个方向的失误都响。
  backend-heavy:
    name: Backend heavy (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: optical-match
            paths: tests/test_optical_match.py
          - lane: seed-intake
            paths: tests/test_seed_intake_audit.py
          - lane: acceptance-patent
            paths: tests/test_acceptance_task_export.py tests/test_patent_to_zmx.py
    # 300 = 最重车道（optical-match，实测 176 分钟）的 1.7 倍，容 runner 机速
    # 方差（GitHub 托管机实测同测试 4x 波动）。挂死仍由 per-test --timeout 点名。
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Git LFS evidence cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.planning/quick/260727-patent-saturation-repository-slimming/lfs-evidence-manifest.json') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Hydrate and verify patent evidence
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (core + dev + optical)
        run: uv sync --frozen --group dev --group optical

      - name: Run heavy lane
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          uv run pytest ${{ matrix.paths }} -q --durations=25 \
            --timeout=7200 --timeout-method=thread -m "not real_machine"
