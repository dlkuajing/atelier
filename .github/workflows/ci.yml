name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (core + dev + optical)
        run: uv sync --frozen --group dev --group optical

      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: uv run pytest -v
