name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Git LFS evidence cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.planning/quick/260727-patent-saturation-repository-slimming/lfs-evidence-manifest.json') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Hydrate and verify patent evidence
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (core + dev + optical)
        run: uv sync --frozen --group dev --group optical

      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: uv run pytest -v
