name: CI

# paths-ignore：纯文档/规划变更不跑全量 pytest（2026-07-27）。
# GitHub 语义 = 变更文件「全部」命中 ignore 才跳过；只要有一个源码文件被改就照跑，
# 因此混合 PR 不会漏测。.github/ 自身不在 ignore 列表，改 CI 必定触发自验。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (core + dev + optical)
        run: uv sync --frozen --group dev --group optical

      # runner 规格是本仓库 CI 时长的第一约束，先把它变成 CI 日志里的事实。
      # 历史教训：曾凭印象在注释里断言「ubuntu-latest 是 4 核 16GB」并据此设 -n 4，
      # 从未核实。本仓库是 PRIVATE，标准 runner 规格与公开仓库不同——实测为准。
      - name: Report runner spec
        run: |
          echo "nproc=$(nproc)"
          echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          free -g
          df -h / | tail -1

      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        # -n 2：保守值，等上面 nproc 的实测结果再定终值。
        # 实测证伪记录（2026-07-27，run 30242379840）：-n 4 跑 37 分 38 秒，
        # 反而比串行基线（~35 分钟，install 仅占 13 秒）**更慢** ——
        # 典型的 worker 数超过物理核数后 CPU 争用 + Optiland/numpy 导入开销 ×N。
        # 不用 -n auto：runner 规格若变，worker 数会跟着涨并撞 Optiland 内存峰值。
        # --durations=25：暴露慢测试分布。若少数光学测试占大头，分档比加并行度有效得多。
        # 不用 -v：逐条输出对 CI 日志无价值，只增加 IO。
        run: uv run pytest -q -n 2 --durations=25
