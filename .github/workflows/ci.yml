name: CI

# paths-ignore：纯文档/规划变更不跑全量 pytest（2026-07-27）。
# GitHub 语义 = 变更文件「全部」命中 ignore 才跳过；只要有一个源码文件被改就照跑，
# 因此混合 PR 不会漏测。.github/ 自身不在 ignore 列表，改 CI 必定触发自验。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.planning/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Git LFS evidence cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('.planning/quick/260727-patent-saturation-repository-slimming/lfs-evidence-manifest.json') }}
          restore-keys: |
            lfs-${{ runner.os }}-

      - name: Hydrate and verify patent evidence
        run: |
          git lfs install --local
          git lfs pull
          git lfs fsck

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (core + dev + optical)
        run: uv sync --frozen --group dev --group optical

      - name: Run tests
        env:
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid/v1
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        # -n 4：ubuntu-latest 是 4 核 16GB，4 worker × Optiland 峰值 1.2GB ≈ 4.8GB，有余量。
        # 串行跑实测 31-36 分钟，本地同一套测试 -n 8 只要 6 分 40 秒——差距几乎全是并行度。
        # 不用 -n auto：runner 规格若变，worker 数会跟着涨并撞 Optiland 内存峰值。
        # 不用 -v：逐条输出对 CI 日志无价值，只增加 IO。
        run: uv run pytest -q -n 4
